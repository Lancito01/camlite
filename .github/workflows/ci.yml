name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --workspace
      - name: Build
        run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: camlite-${{ github.sha }}
          path: |
            target/release/camlite.exe
            target/release/camlite_vcam.dll
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: camlite-${{ github.sha }}
          path: dist
      - name: Release new version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already released; nothing to do."
            exit 0
          }
          gh release create $tag dist/camlite.exe dist/camlite_vcam.dll --title "CamLite $tag" --generate-notes --target $env:GITHUB_SHA
